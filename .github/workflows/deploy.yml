name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify the brand system
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The AI layer claims to be canonical. These two steps are what make that
      # claim true: stale or inconsistent output never reaches production.
      - name: The logo files match the approved masters
        run: python3 tools/build_logos.py --check

      - name: The AI layer matches the visual guides
        run: python3 tools/build_ai.py --check

      - name: The portal agrees with itself
        run: python3 tools/brand_lint.py

  # A pull request that only reports pass or fail gives a designer no way to see
  # what their change looks like. Every PR gets its own URL on the same infra as
  # production, so a proposed change to the standard can be reviewed as a page.
  preview:
    name: Preview
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=the-word-brand --branch=${{ github.head_ref }}

      # Tolerated on failure: until the second Pages project exists this step has
      # nothing to deploy to, and a missing EVERY1 preview must not block a review
      # of the portal.
      - name: Deploy the EVERY1 preview
        id: preview_every1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy every1 --project-name=every1-brand --branch=${{ github.head_ref }}

      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.preview.outputs.deployment-url }}";
            const e1 = "${{ steps.preview_every1.outputs.deployment-url }}";
            if (!url) return;
            const body = [
              "**Preview deployed**",
              "",
              `Portal: ${url}`,
              `Brand Guide: ${url}/brand/`,
              `Assets: ${url}/assets/`,
              `AI manifest: ${url}/ai/manifest.json`,
              "",
              e1 ? `EVERY1 site: ${e1}` : "EVERY1 site: not deployed",
              "",
              "_Rebuilt on every push to this pull request._",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c =>
              c.user.type === "Bot" && c.body.startsWith("**Preview deployed**"));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the portal
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=the-word-brand --branch=main

      # EVERY1 is served from its own domain and its own Pages project, out of the
      # every1/ directory of this same build. One source, two sites, so they cannot
      # disagree about what the brand is.
      - name: Deploy the EVERY1 site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy every1 --project-name=every1-brand --branch=main
